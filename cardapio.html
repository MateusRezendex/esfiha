<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cardápio Completo</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #4a0000;
            margin: 0;
            overflow-x: hidden;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .bg-fixed-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-img {
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(to bottom,
                    rgba(74, 0, 0, 0.85),
                    rgba(74, 0, 0, 0.98)),
                url('./img/fundo.png');

            background-size: cover;
            background-position: center;
        }

        .gold-text {
            color: #d4a017;
        }

        /* ========================= */
        /* CARD PREMIUM INTERATIVO */
        /* ========================= */

        @property --card-border-angle {
            syntax: "<angle>";
            inherits: false;
            initial-value: 0deg;
        }

        @keyframes infinite-card-border {
            to {
                --card-border-angle: 360deg;
            }
        }

        .category-card {
            background:
                linear-gradient(180deg,
                    rgba(74, 0, 0, 0.92),
                    rgba(45, 0, 0, 0.96));

            backdrop-filter: blur(12px);

            border: 1px solid transparent;

            position: relative;

            overflow: hidden;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease,
                background 0.3s ease;
        }

        /* borda desligada neste modelo com foto full-bleed */
        .category-card::before {
            display: none;
        }

        /* brilho interno sem divisão */
        .category-card::after {
            content: "";

            position: absolute;
            inset: 1px;

            background:
                radial-gradient(circle at top left,
                    rgba(255, 255, 255, 0.07),
                    transparent 44%);

            border-radius: inherit;

            opacity: 0.75;

            pointer-events: none;
        }

        /* hover desktop */
        .category-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 10px 30px rgba(255, 80, 0, 0.18),
                0 0 25px rgba(255, 120, 0, 0.08);
        }

        /* toque mobile */
        .category-card:active {
            transform: translateY(-2px) scale(0.99);

            box-shadow:
                0 10px 25px rgba(255, 80, 0, 0.25),
                0 0 30px rgba(255, 120, 0, 0.12);
        }

        /* ========================= */
        /* IMAGENS */
        /* ========================= */

        .category-card img {
            transition:
                transform 0.35s ease,
                filter 0.35s ease;

            will-change: transform;
        }

        /* hover desktop */
        .category-card:hover img {
            transform: scale(1.06) rotate(1deg);

            filter:
                brightness(1.05) saturate(1.08);
        }

        /* toque mobile */
        .category-card:active img {
            transform: scale(1.06);

            filter:
                brightness(1.1) saturate(1.12);
        }

        .menu-card-photo {
            border-radius: 0;
            object-position: center;
            transform: scale(1.01);
        }

        .category-card:hover .menu-card-photo {
            transform: scale(1.05) rotate(1deg);
        }

        .category-card:active .menu-card-photo {
            transform: scale(1.03);
        }

        .menu-product-image {
            transform: scale(1.12);
            filter:
                drop-shadow(0 18px 24px rgba(82, 31, 0, 0.28));
        }

        .category-card:hover .menu-product-image {
            transform: scale(1.18) rotate(1deg);
        }

        .category-card:active .menu-product-image {
            transform: scale(1.17);
        }

        .menu-product-title {
            text-wrap: balance;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
        }

        .menu-product-unavailable::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(32, 12, 4, 0.2);
            pointer-events: none;
        }

        .card-details-panel {
            opacity: 0;
            max-height: 0;
            transform: translateY(-6px);
            pointer-events: none;
            overflow: hidden;
            transition:
                opacity 0.25s ease,
                max-height 0.3s ease,
                transform 0.25s ease;
        }

        .card-details-panel.is-open {
            opacity: 1;
            max-height: 12rem;
            transform: translateY(0);
            pointer-events: auto;
        }

        .menu-reveal {
            opacity: 0;
            transform: translateY(24px) scale(0.98);
            filter: blur(8px);
            transition:
                opacity 0.65s ease,
                transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.65s ease;
            transition-delay: var(--reveal-delay, 0ms);
        }

        .menu-reveal.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }

        @media (prefers-reduced-motion: reduce) {
            .menu-reveal {
                opacity: 1;
                transform: none;
                filter: none;
                transition: none;
            }
        }

        /* ========================= */
        /* BOTÃO + */
        /* ========================= */

        .category-card button {
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .category-card button:hover {
            transform: scale(1.05);

            box-shadow:
                0 8px 18px rgba(239, 68, 68, 0.32);
        }

        .category-card button:active {
            transform: scale(0.92);
        }

        /* ========================= */
        /* TOAST */
        /* ========================= */

        #toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: #facc15;
            color: #000;
            padding: 14px 24px;
            border-radius: 50px;
            font-weight: 800;
            opacity: 0;

            transition:
                all 0.3s cubic-bezier(0.175,
                    0.885,
                    0.32,
                    1.275);

            z-index: 1000;

            box-shadow:
                0 15px 30px rgba(0, 0, 0, 0.5);

            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ========================= */
        /* SCROLLBAR */
        /* ========================= */

        .custom-scrollbar::-webkit-scrollbar {
            width: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 999px;

            border:
                var(--scrollbar-track-margin, 16px) solid transparent;

            background-clip: padding-box;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d4a017;
            border-radius: 999px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #facc15;
        }

        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color:
                #d4a017 rgba(255, 255, 255, 0.06);
        }

        /* ========================= */
        /* MODAL */
        /* ========================= */

        #modal-conteudo {
            position: relative;
        }

        #modal-scroll.hide-native-scrollbar {
            scrollbar-width: none;
        }

        #modal-scroll.hide-native-scrollbar::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        #modal-scrollbar {
            position: absolute;
            right: 18px;
            width: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #modal-thumb {
            position: absolute;
            left: 0;
            width: 100%;
            border-radius: 999px;
            background: #d4a017;
        }

        #modal-revisao {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.9);

            z-index: 1100;

            align-items: center;
            justify-content: center;

            padding:
                clamp(24px, 6vh, 64px) 20px;

            overflow: hidden;
        }

        /* ========================= */
        /* FILTROS PREMIUM */
        /* ========================= */

        .filter-btn {
            position: relative;

            overflow: hidden;

            -webkit-tap-highlight-color: transparent;
        }

        .filter-btn::before {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: inherit;

            background:
                linear-gradient(135deg,
                    rgba(255, 255, 255, 0.08),
                    transparent);

            opacity: 0;

            transition: opacity 0.3s ease;

            pointer-events: none;
        }

        .filter-btn:hover::before {
            opacity: 1;
        }

        .filter-btn.active-filter {
            transform: translateY(-1px);
        }

        .filter-btn.active-filter::after {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: inherit;

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.25);

            pointer-events: none;
        }
    </style>
</head>

<body class="text-white min-h-screen">

    <div class="bg-fixed-container">
        <div class="bg-img"></div>
    </div>

    <div id="toast" role="status" aria-live="polite" aria-atomic="true">
        <i data-lucide="shopping-bag"></i>
        ADICIONADO!
    </div>

    <!-- (cupom removido) -->

    <!-- MODAL -->
    <div id="modal-revisao" role="dialog" aria-modal="true" aria-labelledby="titulo-revisao">

        <div id="modal-conteudo"
            class="bg-[#2d0000] border-2 border-[#d4a017]/40 w-full max-w-lg rounded-[3rem] shadow-2xl text-[1.5rem] overflow-hidden">
            <div id="modal-scroll"
                class="max-h-[calc(100dvh-4rem)] overflow-y-auto hide-native-scrollbar p-7 md:p-8 pr-12 md:pr-14 box-border">

                <h2 id="titulo-revisao" class="text-[#d4a017] font-extrabold text-2xl mb-6 text-center">
                    Confira seu Pedido
                </h2>

                <div id="lista-revisao" class="space-y-3 overflow-y-auto mb-8 pr-2 custom-scrollbar text-[0.75rem] ">
                </div>

                <button type="button" onclick="limparSacola()"
                    class="w-full mb-4 bg-white/10 hover:bg-white/15 py-2.5 md:py-3 rounded-2xl font-bold border border-white/10 text-xs md:text-sm">
                    Limpar sacola
                </button>
                <!-- RESUMO DO PEDIDO (UI/UX aprimorado) -->
                <div class="border-t border-white/10 pt-4 mb-6">
                    <div class="bg-black/20 border border-white/10 rounded-[1.75rem] p-4 md:p-5">
                        <div class="space-y-2.5">
                            <!-- Subtotal -->
                            <div class="flex items-center justify-between">
                                <span class="text-[0.75rem] md:text-sm font-semibold text-white/70">Subtotal</span>
                                <span id="subtotal-revisao" class="text-[0.75rem] md:text-sm font-extrabold text-white">
                                    R$ 0,00
                                </span>
                            </div>
<!-- Entrega -->
                            <div class="flex items-center justify-between">
                                <span class="text-[0.75rem] md:text-sm font-semibold text-white/60">Entrega</span>
                                <span class="text-[0.75rem] md:text-sm font-semibold text-white/60">Consultar</span>
                            </div>
                        </div>

                        <!-- Separador -->
                        <div class="my-4 h-px bg-white/10"></div>

                        <!-- Total final -->
                        <div class="flex items-end justify-between">
                            <div class="flex flex-col">
                                <span class="text-xs md:text-sm font-extrabold uppercase tracking-tight text-white/85">
                                    Subtotal
                                </span>
                                <span class="text-[0.7rem] md:text-xs font-semibold text-white/50 -mt-0.5">
                                    (sem entrega)
                                </span>
                            </div>

                            <span id="total-revisao"
                                class="text-2xl md:text-3xl font-black text-[#facc15] tracking-tight">
                                R$ 0,00
                            </span>
                        </div>

                    </div>
                </div>

                <!-- DADOS PARA ENTREGA -->

                <div class="grid grid-cols-2 gap-4">

                    <button id="btn-voltar" type="button" onclick="fecharRevisao()"
                        class="bg-white/10 py-2.5 md:py-3 rounded-2xl font-bold text-xs md:text-sm">

                        Voltar
                    </button>

                    <button id="btn-enviar" type="button" onclick="confirmarWhatsApp()"
                        class="bg-[#16a34a] py-2.5 md:py-3 rounded-2xl font-black shadow-lg text-xs md:text-sm">

                        ENVIAR AGORA
                    </button>
                </div>
            </div>

            <div id="modal-scrollbar" aria-hidden="true">
                <div id="modal-thumb"></div>
            </div>
        </div>
    </div>

    <!-- NAV -->
    <nav
        class="p-5 sticky top-0 bg-[#4a0000]/95 backdrop-blur-lg z-50 border-b border-white/10 flex justify-between items-center">

        <a href="index.html"
            class="flex items-center text-sm md:text-base font-bold hover:text-[#d4a017] transition-colors">

            <i data-lucide="arrow-left" class="mr-2"></i>
            Inicio
        </a>

        <span class="gold-text font-black tracking-widest text-base md:text-lg uppercase">
            Menu
        </span>

        <div class="w-10"></div>
    </nav>

    <!-- MAIN -->
    <main class="max-w-4xl mx-auto px-4 pt-10 pb-36 relative z-10">

        <!-- CHEFINHO -->
        <section class="mb-8 text-center flex flex-col items-center">

            <img src="./img/chefinho.png" alt="Chef" decoding="async"
                class="w-56 md:w-62 h-auto drop-shadow-xl transition-transform duration-300 ease-out hover:scale-[1.03]">

            <div class="bg-white/5 border border-white/5 backdrop-blur-sm p-5 rounded-[2rem] w-full shadow-lg">

                <h2 class="text-xl md:text-2xl font-extrabold gold-text mb-2 tracking-tight">
                    Que bom te ver por aqui!
                </h2>

                <p class="text-white/70 text-sm md:text-base leading-relaxed">
                    Escolha suas favoritas abaixo e monte seu pedido!
                </p>
             </div>
         </section>

        <!-- DESTAQUES (CAROUSEL) -->
        <section class="mb-10">
            <div class="flex items-center gap-3 mb-4">
                <i data-lucide="star" class="w-6 h-6 md:w-7 md:h-7 text-[#facc15]"></i>
                <h2 class="text-base md:text-lg font-black tracking-widest uppercase text-[#facc15]">
                    Destaques de hoje
                </h2>
            </div>

            <div class="relative">
                <button id="carousel-prev" type="button" aria-label="Voltar destaques"
                    class="hidden md:grid place-items-center absolute left-2 top-1/2 -translate-y-1/2 z-20 w-11 h-11 rounded-full bg-black/40 hover:bg-black/55 border border-white/10 backdrop-blur-md transition"
                    onclick="scrollDestaques(-1)">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>

                <button id="carousel-next" type="button" aria-label="Avançar destaques"
                    class="hidden md:grid place-items-center absolute right-2 top-1/2 -translate-y-1/2 z-20 w-11 h-11 rounded-full bg-black/40 hover:bg-black/55 border border-white/10 backdrop-blur-md transition"
                    onclick="scrollDestaques(1)">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>

                <div id="carousel-destaques"
                    class="flex gap-5 overflow-x-auto no-scrollbar scroll-smooth snap-x snap-mandatory pb-2 pr-2 bg-transparent">
                </div>
            </div>
        </section>

        <!-- FILTROS -->
        <section class="mb-10">

            <div class="sticky top-[72px] md:top-[84px] z-40">

                <div class="relative overflow-visible rounded-[2rem]">
                    <!-- brilho decorativo -->
                    <div class="pointer-events-none absolute inset-0
    bg-gradient-to-r
    from-white/[0.03]
    via-transparent
    to-white/[0.02]"">
                    </div>

                    <div class=" flex gap-3 overflow-x-auto no-scrollbar relative z-10">

                        <!-- TODOS -->
                        <button type="button" data-section-filter="all" aria-pressed="true" class="filter-btn active-filter flex-shrink-0 px-5 py-3 rounded-[1.4rem]
                    text-xs md:text-sm font-black tracking-tight
                    transition-all duration-300
                    bg-[#facc15] text-black
                    shadow-[0_8px_25px_rgba(250,204,21,0.35)]
                    active:scale-95">

                            Todos
                        </button>

                        <!-- TRADICIONAIS -->
                        <button type="button" data-section-filter="tradicionais" aria-pressed="false" class="filter-btn inactive-filter flex-shrink-0 px-5 py-3 rounded-[1.4rem]
                    text-xs md:text-sm font-extrabold tracking-tight
                    border border-white/10
                    bg-white/5 text-white/85
                    backdrop-blur-xl
                    hover:bg-white/10
                    hover:border-[#facc15]/30
                    hover:text-white
                    hover:-translate-y-1
                    active:scale-95
                    transition-all duration-300">

                            Tradicionais
                        </button>

                        <!-- PREMIUM -->
                        <button type="button" data-section-filter="premium" aria-pressed="false" class="filter-btn inactive-filter flex-shrink-0 px-5 py-3 rounded-[1.4rem]
                    text-xs md:text-sm font-extrabold tracking-tight
                    border border-white/10
                    bg-white/5 text-white/85
                    backdrop-blur-xl
                    hover:bg-white/10
                    hover:border-[#facc15]/30
                    hover:text-white
                    hover:-translate-y-1
                    active:scale-95
                    transition-all duration-300">

                            Premium
                        </button>

                        <!-- DOCES -->
                        <button type="button" data-section-filter="doces" aria-pressed="false" class="filter-btn inactive-filter flex-shrink-0 px-5 py-3 rounded-[1.4rem]
                    text-xs md:text-sm font-extrabold tracking-tight
                    border border-white/10
                    bg-white/5 text-white/85
                    backdrop-blur-xl
                    hover:bg-white/10
                    hover:border-pink-400/40
                    hover:text-white
                    hover:-translate-y-1
                    active:scale-95
                    transition-all duration-300">

                            Doces
                        </button>

                    </div>
                </div>
            </div>
        </section>

        <!-- TRADICIONAIS -->
        <section id="sec-tradicionais" data-section="tradicionais" class="mb-16">

            <h2 class="text-xl md:text-2xl font-black mb-8 gold-text flex items-center gap-3">

                <i data-lucide="flame" class="w-8 h-8 md:w-10 md:h-10 fill-[#d4a017]"></i>

                TRADICIONAIS
            </h2>

            <div class="grid gap-6">
                <div id="lista-tradicionais" class="grid gap-6 lg:grid-cols-2"></div>
            </div>
        </section>

        <!-- PREMIUM -->
        <section id="sec-premium" data-section="premium" class="mb-16">

            <h2 class="text-xl md:text-2xl font-black mb-8 gold-text flex items-center gap-3">

                <i data-lucide="crown" class="w-8 h-8 md:w-10 md:h-10 fill-[#d4a017]"></i>

                PREMIUM
            </h2>

            <div class="grid gap-6">
                <div id="lista-premium" class="grid gap-6 lg:grid-cols-2"></div>
            </div>
        </section>

        <!-- DOCES -->
        <section id="sec-doces" data-section="doces" class="mb-10">

            <h2 class="text-xl md:text-2xl font-black mb-8 gold-text flex items-center gap-3">

                <i data-lucide="heart" class="w-8 h-8 md:w-10 md:h-10 fill-[#d4a017]"></i>

                DOCES
            </h2>

            <div class="grid gap-6">
                <div id="lista-doces" class="grid gap-6 lg:grid-cols-2"></div>
            </div>
        </section>

    </main>

    <!-- SACOLA -->
    <div class="fixed bottom-0 left-0 w-full p-4 md:p-6 z-50 bg-gradient-to-t from-[#2d0000] to-transparent">

        <button onclick="abrirRevisao()" id="btn-abrir-revisao"
            class="flex items-center justify-between w-1/2 min-w-[18rem] md:w-[24rem] mx-auto bg-[#16a34a] text-white py-4 md:py-6 px-4 md:px-6 rounded-[2rem] md:rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.6)] border-t border-white/20">

            <div class="flex items-center gap-2 md:gap-3">

                <div class="relative">
                    <i data-lucide="shopping-cart" class="w-6 h-6 md:w-8 md:h-8"></i>

                    <span id="qtd-badge"
                        class="hidden absolute -top-2 -right-2 md:-top-3 md:-right-3 min-w-6 h-6 md:min-w-7 md:h-7 px-2 rounded-full bg-[#facc15] text-black text-sm font-black flex items-center justify-center shadow-lg"
                        aria-label="Quantidade de itens na sacola">
                        0
                    </span>
                </div>

                <span class="text-sm hidden sm:flex font-black uppercase tracking-tighter">
                    Ver Sacola
                </span>
            </div>

            <span id="total-badge" class="bg-black/30 px-4 md:px-6 py-2 rounded-xl text-sm font-bold">

                R$ 0,00
            </span>
        </button>
    </div>

    <script>
        const brl = new Intl.NumberFormat('pt-BR', {
            style: 'currency',
            currency: 'BRL'
        });

        let carrinho =
            JSON.parse(localStorage.getItem('carrinho_esfiha')) || {};

        function escJs(str) {
            return String(str).replaceAll('\\', '\\\\').replaceAll("'", "\\'");
        }

        function toggleDetalhes(btn) {
            const card = btn.closest('.category-card');
            if (!card) return;

            const panel = card.querySelector('[data-card-details]');
            if (!panel) return;

            const isOpen = panel.classList.toggle('is-open');
            btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            btn.textContent = isOpen ? '- Detalhes' : '+ Detalhes';
        }

        function renderItens(containerId, itens, extraCardClasses = '') {
            const container = document.getElementById(containerId);

            if (!container) return;

            const html = itens.map((item, idx) => {
                const qtd = (carrinho && carrinho[item.n]) ? carrinho[item.n].qtd : 0;
                const safeName = escJs(item.n);

                const rightControl = item.indisponivel ? `
            <button type="button" disabled aria-disabled="true"
                class="h-11 min-w-[8.25rem] rounded-full bg-[#facc15]/60 text-black grid place-items-center shadow-lg opacity-70 cursor-not-allowed text-xs font-black">
                Indisponível
            </button>
                ` : (qtd > 0 ? `
            <div class="flex items-center bg-[#facc15] text-black rounded-full shadow-lg overflow-hidden">
                <button type="button" aria-label="Diminuir ${item.n}"
                    onclick="ajustarQuantidade('${safeName}', -1)"
                    class="w-10 h-11 grid place-items-center hover:bg-[#eab308] active:scale-95 transition">
                    <i data-lucide="minus" class="w-4 h-4"></i>
                </button>
                <span class="min-w-7 text-center font-black text-sm px-1">${qtd}</span>
                <button type="button" aria-label="Aumentar ${item.n}"
                    onclick="ajustarQuantidade('${safeName}', 1)"
                    class="w-10 h-11 grid place-items-center hover:bg-[#eab308] active:scale-95 transition">
                    <i data-lucide="plus" class="w-4 h-4"></i>

        const tradicionais = [

        function getDestaques() {
            const preferidos = [

                "Banana Nevada",
                "Frango com Catupiry",
                "3 Queijos",
                "Frango com Bacon"
            ];

            const all = [...tradicionais, ...premium, ...doces];
            const byName = new Map(all.map((it) => [it.n, it]));

            const picks = preferidos
                .map((n) => byName.get(n))
                .filter(Boolean);

            if (picks.length < 5) {
                all.forEach((it) => {
                    if (picks.length >= 5) return;
                    if (picks.some((p) => p.n === it.n)) return;
                    picks.push(it);
                });
            }

            return picks;
        }

        function scrollDestaques(direction) {
            const el = document.getElementById('carousel-destaques');
            if (!el) return;
            const amount = Math.max(240, Math.floor(el.clientWidth * 0.85));
            el.scrollBy({ left: direction * amount, behavior: 'smooth' });
        }

        let revealObserver = null;

        function initCardReveal() {
            const cards = Array.from(document.querySelectorAll('.menu-reveal'));
            if (!cards.length) return;

            if (!('IntersectionObserver' in window)) {
                cards.forEach((card) => card.classList.add('is-visible'));
                return;
            }

            if (revealObserver) revealObserver.disconnect();

            revealObserver = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    entry.target.classList.toggle(
                        'is-visible',
                        entry.isIntersecting
                    );
                });
            }, {
                threshold: 0.18,
                rootMargin: '0px 0px -8% 0px'
            });

            cards.forEach((card) => revealObserver.observe(card));
        }

        function renderTudo() {
            renderDestaques();
            renderItens('lista-tradicionais', tradicionais);
            renderItens('lista-premium', premium, 'border-[#facc15]/30');
            renderItens('lista-doces', doces, 'border-pink-500/20');
            lucide.createIcons();
            initCardReveal();
        }

        renderTudo();

        let total = 0;
        let subtotal = 0;
        let totalQtd = 0;
        let ultimoFoco = null;

        atualizarTotal();

        const modal = document.getElementById('modal-revisao');
        const listaRevisao = document.getElementById('lista-revisao');
        const modalScroll = document.getElementById('modal-scroll');

        if (listaRevisao) {
            listaRevisao.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-carrinho-action]');
                if (!btn) return;

                const item = decodeURIComponent(btn.getAttribute('data-item') || '');
                const action = btn.getAttribute('data-carrinho-action');

                if (!item) return;

                ajustarQuantidade(item, action === 'inc' ? 1 : -1);
            });
        }

        if (modalScroll) {
            modalScroll.addEventListener('scroll', () => {
                if (!modal || modal.style.display !== 'flex') return;
                atualizarScrollModal();
            }, { passive: true });
        }

        function add(nome, preco) {

            if (!carrinho[nome]) {
                carrinho[nome] = {
                    qtd: 0,
                    preco: preco
                };
            }

            carrinho[nome].qtd++;

            salvarCarrinho();

            atualizarTotal();
            renderTudo();

            const t = document.getElementById('toast');

            t.style.opacity = '1';

            setTimeout(() => {
                t.style.opacity = '0';
            }, 1000);
        }

        function atualizarTotal() {

            total = 0;
            subtotal = 0;
            totalQtd = 0;

            for (let i in carrinho) {
                subtotal += carrinho[i].qtd * carrinho[i].preco;
                totalQtd += carrinho[i].qtd;
            }

            total = Math.max(0, subtotal);

            // Valores exibidos sem taxa de entrega (a taxa é consultada depois)
            const subtotalExibido = subtotal;
            const totalExibido = subtotalExibido;


            document.getElementById('total-badge').innerText =
                brl.format(totalExibido);

            const qtdBadge = document.getElementById('qtd-badge');
            if (qtdBadge) {
                qtdBadge.innerText = String(totalQtd);
                if (totalQtd > 0) qtdBadge.classList.remove('hidden');
                else qtdBadge.classList.add('hidden');
            }

            if (document.getElementById('total-revisao')) {

                document.getElementById('total-revisao').innerText =
                    brl.format(totalExibido);
            }

            // Total (com entrega) é preenchido manualmente

            const subtotalEl = document.getElementById('subtotal-revisao');
            if (subtotalEl) subtotalEl.innerText = brl.format(subtotal);

            const qtdRevisao = document.getElementById('qtd-revisao');
            if (qtdRevisao) qtdRevisao.innerText = String(totalQtd);
        }

        function setSectionFilter(filter) {

            const sections = Array.from(
                document.querySelectorAll('section[data-section]')
            );

            const buttons = Array.from(
                document.querySelectorAll(
                    'button.filter-btn[data-section-filter]'
                )
            );

            sections.forEach((sec) => {

                const secKey = sec.getAttribute('data-section');

                const show =
                    filter === 'all' || secKey === filter;

                sec.classList.toggle('hidden', !show);
            });

            buttons.forEach((btn) => {

                const isActive =
                    btn.getAttribute('data-section-filter') === filter;

                btn.setAttribute(
                    'aria-pressed',
                    isActive ? 'true' : 'false'
                );

                if (isActive) {

                    btn.classList.remove(
                        'inactive-filter',
                        'bg-white/5',
                        'text-white/85',
                        'border-white/10'
                    );

                    btn.classList.add(
                        'active-filter',
                        'bg-[#facc15]',
                        'text-black',
                        'shadow-[0_8px_25px_rgba(250,204,21,0.35)]'
                    );

                } else {

                    btn.classList.remove(
                        'active-filter',
                        'bg-[#facc15]',
                        'text-black',
                        'shadow-[0_8px_25px_rgba(250,204,21,0.35)]'
                    );

                    btn.classList.add(
                        'inactive-filter',
                        'bg-white/5',
                        'text-white/85',
                        'border-white/10'
                    );
                }
            });

            const firstVisible = sections.find(
                s => !s.classList.contains('hidden')
            );

            if (firstVisible) {

                firstVisible.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        }

        function initSectionFilters() {
            const buttons = Array.from(document.querySelectorAll('button.filter-btn[data-section-filter]'));
            if (!buttons.length) return;

            buttons.forEach((btn) => {
                btn.addEventListener('click', () => {
                    const filter = btn.getAttribute('data-section-filter') || 'all';
                    setSectionFilter(filter);
                });
            });
        }

        initSectionFilters();

        function abrirModal() {
            if (!modal) return;

            ultimoFoco = document.activeElement;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';

            atualizarScrollModal();

            const btnEnviar = document.getElementById('btn-enviar');
            if (btnEnviar) btnEnviar.focus();
        }

        function atualizarScrollModal() {
            const scrollEl = document.getElementById('modal-scroll');
            const bar = document.getElementById('modal-scrollbar');
            const thumb = document.getElementById('modal-thumb');
            if (!scrollEl || !bar || !thumb) return;

            const client = scrollEl.clientHeight || 0;
            const scrollH = scrollEl.scrollHeight || 0;

            if (!client || scrollH <= client + 1) {
                bar.style.opacity = '0';
                return;
            }

            // Track com ~70% da altura do container, centralizado.
            const trackH = Math.max(90, Math.floor(client * 0.7));
            const top = Math.max(0, Math.floor((client - trackH) / 2));

            bar.style.top = `${top}px`;
            bar.style.height = `${trackH}px`;
            bar.style.opacity = '1';

            const maxScroll = scrollH - client;
            const ratio = maxScroll > 0 ? (scrollEl.scrollTop / maxScroll) : 0;

            const thumbH = Math.max(24, Math.floor(trackH * (client / scrollH)));
            const thumbTop = Math.floor((trackH - thumbH) * Math.min(1, Math.max(0, ratio)));

            thumb.style.height = `${thumbH}px`;
            thumb.style.top = `${thumbTop}px`;
        }

        function fecharRevisao() {
            if (!modal) return;

            modal.style.display = 'none';
            document.body.style.overflow = '';

            if (ultimoFoco && typeof ultimoFoco.focus === 'function') {
                ultimoFoco.focus();
            }
        }

        function limparSacola() {
            carrinho = {};
            localStorage.setItem('carrinho_esfiha', JSON.stringify(carrinho));
            atualizarTotal();
            renderTudo();

            const lista = document.getElementById('lista-revisao');
            if (lista) lista.innerHTML = '';

            fecharRevisao();
        }

        function salvarCarrinho() {
            localStorage.setItem('carrinho_esfiha', JSON.stringify(carrinho));
        }

        function renderRevisao() {

            const lista = document.getElementById('lista-revisao');
            if (!lista) return;

            lista.innerHTML = '';

            for (const item in carrinho) {

                const itemKey = encodeURIComponent(item);

                lista.innerHTML += `
                    <div class="flex justify-between gap-3 items-center bg-white/5 p-4 rounded-2xl border border-white/10">

                        <div class="min-w-0">
                            <p class="font-bold leading-tight truncate text-xs md:text-sm">

                            </p>

                            <p class="text-white/50 text-[0.7rem] md:text-xs">

                            <span class="font-black text-[#facc15] whitespace-nowrap text-xs md:text-sm text-right">
                                ${brl.format(carrinho[item].qtd * carrinho[item].preco)}
                            </span>

                            <div class="inline-flex items-center gap-1 bg-black/20 rounded-2xl px-1.5 py-1 border border-white/10">
                                <button type="button"
                                    data-carrinho-action="dec"
                                    data-item="${itemKey}"
                                    aria-label="Diminuir ${item}"
                                    class="w-7 h-7 rounded-lg bg-white/10 hover:bg-white/15 border border-white/10 font-black text-xs leading-none">
                                    -
                                </button>

                                <span class="font-extrabold text-[0.7rem] w-5 text-center select-none">
                                    ${carrinho[item].qtd}
                                </span>

                                <button type="button"
                                    data-carrinho-action="inc"
                                    data-item="${itemKey}"
                                    aria-label="Aumentar ${item}"
                                    class="w-7 h-7 rounded-lg bg-white/10 hover:bg-white/15 border border-white/10 font-black text-xs leading-none">
                                    +
                                </button>
                            </div>
                        </div>
                    </div>`;
            }

            ajustarAlturaListaRevisao();
        }

        function ajustarAlturaListaRevisao() {
            const lista = document.getElementById('lista-revisao');
            if (!lista) return;

            const aplicar = () => {
                const itens = Array.from(lista.children);

                const maxItensVisiveis = 2;

                if (itens.length <= maxItensVisiveis) {
                    lista.style.maxHeight = '';
                    return true;
                }

                // Altura = bottom do N-ésimo item relativo ao topo da lista.
                // Usa DOMRects para considerar margens/gaps corretamente.
                const listaRect = lista.getBoundingClientRect();
                const ultimoItemVisivel = itens[maxItensVisiveis - 1];
                const itemRect = ultimoItemVisivel.getBoundingClientRect();

                const altura = Math.max(0, Math.floor(itemRect.bottom - listaRect.top));

                lista.style.maxHeight = `${altura}px`;
                return altura > 0;
            };

            requestAnimationFrame(() => {
                const ok = aplicar();
                // Reaplica em seguida para garantir after fonts/layout settle.
                if (!ok) setTimeout(aplicar, 50);
                else setTimeout(aplicar, 50);
            });
        }

        function ajustarQuantidade(item, delta) {

            if (!carrinho[item]) return;

            carrinho[item].qtd += delta;

            if (carrinho[item].qtd <= 0) {
                delete carrinho[item];
            }

            salvarCarrinho();
            atualizarTotal();
            renderTudo();

            if (Object.keys(carrinho).length === 0) {
                const lista = document.getElementById('lista-revisao');
                if (lista) lista.innerHTML = '';
                fecharRevisao();
                return;
            }

            renderRevisao();
        }

        function abrirRevisao() {

            if (Object.keys(carrinho).length === 0) {

                alert("Sua sacola está vazia! Escolha uma delícia primeiro.");

                return;
            }

            renderRevisao();

            abrirModal();
        }

        function confirmarWhatsApp() {

            let msg = "Olá! Quero saborear o seguinte pedido:\n\n";

            for (const item in carrinho) {
                msg += `*${carrinho[item].qtd}x* ${item}\n`;
            }
            msg += `\nSubtotal: ${brl.format(subtotal)}`;

            msg += `\nTaxa de entrega: *Consultar taxa de entrega*`;

            // 🔥 ENVIA PARA WHATSAPP
            window.open(
                `https://wa.me/5564992186249?text=${encodeURIComponent(msg)}`,
                '_blank'
            );

            // ✅ LIMPA SACOLA DEPOIS DO ENVIO
            carrinho = {};
            localStorage.removeItem('carrinho_esfiha');
            atualizarTotal();
            renderTudo();

            const lista = document.getElementById('lista-revisao');
            if (lista) lista.innerHTML = '';

            fecharRevisao();
        }
    </script>
