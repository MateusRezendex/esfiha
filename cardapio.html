<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cardápio Completo - Esfiha Sabor que Vicia</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #4a0000;
            margin: 0;
            overflow-x: hidden;
        }

        .bg-fixed-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-img {
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(to bottom,
                    rgba(74, 0, 0, 0.85),
                    rgba(74, 0, 0, 0.98)),
                url('./img/fundo.png');

            background-size: cover;
            background-position: center;
        }

        .gold-text {
            color: #d4a017;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 160, 23, 0.2);
            transition: transform 0.2s;
        }

        .preco-antigo {
            text-decoration: line-through;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
        }

        #toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: #facc15;
            color: #000;
            padding: 14px 24px;
            border-radius: 50px;
            font-weight: 800;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 999px;
            /* Ajustável via JS para "encurtar" a trilha */
            border: var(--scrollbar-track-margin, 16px) solid transparent;
            background-clip: padding-box;
        }

        .custom-scrollbar::-webkit-scrollbar-track-piece:start {}

        .custom-scrollbar::-webkit-scrollbar-track-piece:end {}

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d4a017;
            border-radius: 999px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #facc15;
        }

        /* Firefox */
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #d4a017 rgba(255, 255, 255, 0.06);
        }

        /* Scrollbar custom da MODAL (barra "curta" e mais à esquerda) */
        #modal-conteudo {
            position: relative;
        }

        #modal-scroll.hide-native-scrollbar {
            scrollbar-width: none;
            /* Firefox */
        }

        #modal-scroll.hide-native-scrollbar::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        #modal-scrollbar {
            position: absolute;
            right: 18px;
            width: 6px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        #modal-thumb {
            position: absolute;
            left: 0;
            width: 100%;
            border-radius: 999px;
            background: #d4a017;
        }

        #modal-revisao {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1100;
            align-items: center;
            justify-content: center;
            /* Garante respiro no topo/rodapé e evita "colar" nas bordas */
            padding: clamp(24px, 6vh, 64px) 20px;
            overflow: hidden;
        }
    </style>
</head>

<body class="text-white min-h-screen">

    <div class="bg-fixed-container">
        <div class="bg-img"></div>
    </div>

    <div id="toast" role="status" aria-live="polite" aria-atomic="true">
        <i data-lucide="shopping-bag"></i>
        ADICIONADO!
    </div>

    <!-- MODAL -->
    <div id="modal-revisao" role="dialog" aria-modal="true" aria-labelledby="titulo-revisao">

        <div id="modal-conteudo"
            class="bg-[#2d0000] border-2 border-[#d4a017]/40 w-full max-w-lg rounded-[3rem] shadow-2xl text-[1.5rem] overflow-hidden">
            <div id="modal-scroll"
                class="max-h-[calc(100dvh-4rem)] overflow-y-auto hide-native-scrollbar p-7 md:p-8 pr-12 md:pr-14 box-border">

                <h2 id="titulo-revisao" class="text-[#d4a017] font-extrabold text-2xl mb-6 text-center">
                    Confira seu Pedido
                </h2>

                <div id="lista-revisao" class="space-y-3 overflow-y-auto mb-8 pr-2 custom-scrollbar text-[0.75rem] ">
                </div>

                <button type="button" onclick="limparSacola()"
                    class="w-full mb-4 bg-white/10 hover:bg-white/15 py-2.5 md:py-3 rounded-2xl font-bold border border-white/10 text-xs md:text-sm">
                    Limpar sacola
                </button>

                <div class="border-t border-white/10 pt-4 mb-6 flex justify-between items-center">

                    <div class="flex flex-col">
                        <span class="text-xs md:text-sm font-bold leading-tight">
                            Total:
                        </span>

                        <span class="text-white/60 font-semibold text-xs md:text-sm">
                            Itens: <span id="qtd-revisao">0</span>
                        </span>
                    </div>

                    <div class="flex flex-col items-end gap-1">
                        <span class="text-white/60 text-[0.7rem] md:text-xs font-semibold">
                            Taxa de entrega: consultar
                        </span>
                        <span id="total-revisao" class="text-xl md:text-lg font-black text-[#facc15]">
                            R$ 0,00
                        </span>
                    </div>
                </div>

                <!-- DADOS PARA ENTREGA -->
                <div class="mb-4 space-y-3">

                    <fieldset class="space-y-2">
                        <legend class="font-extrabold text-xs md:text-sm text-white/90">
                            Forma de pagamento
                        </legend>

                        <div class="grid grid-cols-2 gap-2">
                            <label
                                class="flex items-center gap-2 bg-black/20 border border-white/10 rounded-2xl px-3 py-2 cursor-pointer select-none">
                                <input type="radio" name="pagamento" value="Pix" class="accent-[#facc15]">
                                <span class="font-bold text-xs md:text-sm">Pix</span>
                            </label>

                            <label
                                class="flex items-center gap-2 bg-black/20 border border-white/10 rounded-2xl px-3 py-2 cursor-pointer select-none">
                                <input type="radio" name="pagamento" value="Cartão" class="accent-[#facc15]">
                                <span class="font-bold text-xs md:text-sm">Cartão</span>
                            </label>
                        </div>
                    </fieldset>

                </div>

                <div class="grid grid-cols-2 gap-4">

                    <button id="btn-voltar" type="button" onclick="fecharRevisao()"
                        class="bg-white/10 py-2.5 md:py-3 rounded-2xl font-bold text-xs md:text-sm">

                        Voltar
                    </button>

                    <button id="btn-enviar" type="button" onclick="confirmarWhatsApp()"
                        class="bg-[#16a34a] py-2.5 md:py-3 rounded-2xl font-black shadow-lg text-xs md:text-sm">

                        ENVIAR AGORA
                    </button>
                </div>
            </div>

            <div id="modal-scrollbar" aria-hidden="true">
                <div id="modal-thumb"></div>
            </div>
        </div>
    </div>

    <!-- NAV -->
    <nav
        class="p-5 sticky top-0 bg-[#4a0000]/95 backdrop-blur-lg z-50 border-b border-white/10 flex justify-between items-center">

        <a href="index.html"
            class="flex items-center text-sm md:text-base font-bold hover:text-[#d4a017] transition-colors">

            <i data-lucide="arrow-left" class="mr-2"></i>
            INÍCIO
        </a>

        <span class="gold-text font-black tracking-widest text-base md:text-lg uppercase">
            Menu
        </span>

        <div class="w-10"></div>
    </nav>

    <!-- MAIN -->
    <main class="max-w-4xl mx-auto px-4 pt-10 pb-36 relative z-10">

        <!-- CHEFINHO -->
        <section class="mb-8 text-center flex flex-col items-center">

            <img src="./img/chefinho.png" alt="Chef Sabor que Vicia" decoding="async"
                class="w-56 md:w-62 h-auto drop-shadow-xl">

            <div class="bg-white/5 border border-white/5 backdrop-blur-sm p-5 rounded-[2rem] w-full shadow-lg">

                <h2 class="text-xl md:text-2xl font-extrabold gold-text mb-2 tracking-tight">
                    Que bom te ver por aqui! 🧡
                </h2>

                <p class="text-white/70 text-sm md:text-base leading-relaxed">
                    Escolha suas favoritas abaixo e monte seu pedido!
                </p>
            </div>
        </section>

        <!-- TRADICIONAIS -->
        <section class="mb-16">

            <h2 class="text-xl md:text-2xl font-black mb-8 gold-text flex items-center gap-3">

                <i data-lucide="flame" class="w-8 h-8 md:w-10 md:h-10 fill-[#d4a017]"></i>

                TRADICIONAIS
            </h2>

            <div class="grid gap-6">
                <div id="lista-tradicionais" class="grid gap-6 lg:grid-cols-2"></div>
            </div>
        </section>

        <!-- PREMIUM -->
        <section class="mb-16">

            <h2 class="text-xl md:text-2xl font-black mb-8 gold-text flex items-center gap-3">

                <i data-lucide="crown" class="w-8 h-8 md:w-10 md:h-10 fill-[#d4a017]"></i>

                PREMIUM
            </h2>

            <div class="grid gap-6">
                <div id="lista-premium" class="grid gap-6 lg:grid-cols-2"></div>
            </div>
        </section>

        <!-- DOCES -->
        <section class="mb-10">

            <h2 class="text-xl md:text-2xl font-black mb-8 gold-text flex items-center gap-3">

                <i data-lucide="heart" class="w-8 h-8 md:w-10 md:h-10 fill-[#d4a017]"></i>

                DOCES IRRESISTÍVEIS
            </h2>

            <div class="grid gap-6">
                <div id="lista-doces" class="grid gap-6 lg:grid-cols-2"></div>
            </div>
        </section>

    </main>

    <!-- SACOLA -->
    <div class="fixed bottom-0 left-0 w-full p-4 md:p-6 z-50 bg-gradient-to-t from-[#2d0000] to-transparent">

        <button onclick="abrirRevisao()" id="btn-abrir-revisao"
            class="flex items-center justify-between w-1/2 min-w-[18rem] md:w-[24rem] mx-auto bg-[#16a34a] text-white py-4 md:py-6 px-4 md:px-6 rounded-[2rem] md:rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.6)] border-t border-white/20">

            <div class="flex items-center gap-2 md:gap-3">

                <div class="relative">
                    <i data-lucide="shopping-cart" class="w-6 h-6 md:w-8 md:h-8"></i>

                    <span id="qtd-badge"
                        class="hidden absolute -top-2 -right-2 md:-top-3 md:-right-3 min-w-6 h-6 md:min-w-7 md:h-7 px-2 rounded-full bg-[#facc15] text-black text-sm font-black flex items-center justify-center shadow-lg"
                        aria-label="Quantidade de itens na sacola">
                        0
                    </span>
                </div>

                <span class="text-sm hidden sm:flex font-black uppercase tracking-tighter">
                    Ver Sacola
                </span>
            </div>

            <span id="total-badge" class="bg-black/30 px-4 md:px-6 py-2 rounded-xl text-sm font-bold">

                R$ 0,00
            </span>
        </button>
    </div>

    <script>
        const brl = new Intl.NumberFormat('pt-BR', {
            style: 'currency',
            currency: 'BRL'
        });

        function renderItens(containerId, itens, extraCardClasses = '') {
            const container = document.getElementById(containerId);

            if (!container) return;

            const html = itens.map(item => `
                    <div class="category-card rounded-[2.2rem] p-4 md:p-6 flex flex-col md:flex-row items-center gap-4 md:gap-8 lg:text-sm ${extraCardClasses}">

                        <img
                            src="./img/esfihas/${item.i}.png"
                            class="w-32 h-32 sm:w-40 sm:h-40 md:w-44 md:h-44 object-cover rounded-[2rem] shadow-xl flex-shrink-0"
                            alt="${item.n}"
                            loading="lazy"
                            decoding="async"
                            width="176"
                            height="176">

                        <div class="flex-1 w-full text-center md:text-left">

                            <h3 class="text-base md:text-lg lg:text-base font-extrabold text-white mb-2">
                                ${item.n}
                            </h3>

                            <p class="text-white/70 text-[0.75rem] md:text-xs lg:text-[0.75rem] leading-relaxed mb-4 md:mb-6 font-medium">
                                ${item.d}
                            </p>

                            <div class="flex items-center justify-between">

                                <div class="flex flex-col text-left">

                                    <span class="preco-antigo">
                                        ${brl.format(item.a)}
                                    </span>

                                    <span class="text-lg md:text-xl lg:text-lg font-black text-[#facc15]">
                                        ${brl.format(item.p)}
                                    </span>
                                </div>

                                <button
                                    type="button"
                                    aria-label="Adicionar ${item.n}"
                                    onclick="add('${item.n}', ${item.p})"
                                    class="bg-[#16a34a] hover:bg-[#15803d] p-2.5 md:p-3 rounded-2xl md:rounded-3xl shadow-xl transition-all active:scale-90">

                                    <i data-lucide="plus"
                                        class="w-5 h-5 md:w-6 md:h-6"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');

            container.innerHTML = html;
        }

        const tradicionais = [
            { n: "Frango com Catupiry", d: "Frango desfiado com catupiry original e cheiro verde fresco.", p: 6.99, a: 8.00, i: "frango" },
            { n: "Queijo", d: "Mix de mussarela, queijo minas, creme de leite e orégano.", p: 6.99, a: 8.00, i: "queijo" },
            { n: "Queijo com Presunto", d: "Mussarela selecionada, presunto picado e orégano.", p: 6.99, a: 8.00, i: "presunto" },
            { n: "Calabresa com Cebola", d: "Calabresa fatiada, cebola e um toque de mussarela.", p: 6.99, a: 8.00, i: "calabresa" },
            { n: "Bacon", d: "Bacon crocante em fatias com generosa camada de mussarela.", p: 6.99, a: 8.00, i: "bacon" },
            { n: "Frango com Bacon", d: "Combinação perfeita de frango desfiado, bacon e mussarela.", p: 6.99, a: 8.00, i: "frango_bacon" }
        ];

        const premium = [
            { n: "3 Queijos", d: "A união nobre de Mussarela, Catupiry e Provolone defumado.", p: 7.90, a: 9.00, i: "3queijos" },
            { n: "Carne", d: "Carne moída premium temperada com tomate, cebola e limão.", p: 7.90, a: 9.00, i: "carne" },
            { n: "Brócolis com Queijo", d: "Brócolis fresco no vapor, mussarela e pedaços de bacon.", p: 7.90, a: 9.00, i: "brocolis" },
            { n: "Lombinho Canadense", d: "Lombo canadense fatiado com mussarela.", p: 7.90, a: 9.00, i: "lombo" },
            { n: "Carne Seca", d: "Carne seca desfiada artesanalmente com catupiry.", p: 9.50, a: 10.50, i: "carne_seca" }
        ];

        const doces = [
            { n: "Chocolate c/ Morango", d: "Ganache de chocolate ao leite com morangos frescos fatiados.", p: 8.99, a: 10.00, i: "chocolate_morango" },
            { n: "Chocolate com MM", d: "Chocolate cremoso coberto com M&Ms coloridos.", p: 8.99, a: 10.00, i: "MM" },
            { n: "Banana Nevada", d: "Banana fatiada, chocolate branco gratinado, açúcar e canela.", p: 7.99, a: 9.00, i: "banana_nevada" },
            { n: "Abacaxi Nevado", d: "Abacaxi em calda artesanal com chocolate branco gratinado.", p: 7.99, a: 9.00, i: "abacaxi_nevado" },
            { n: "Romeu e Julieta", d: "A clássica combinação de queijo minas com goiabada.", p: 7.99, a: 9.00, i: "romeu_julieta" }
        ];

        renderItens('lista-tradicionais', tradicionais);
        renderItens('lista-premium', premium, 'border-[#facc15]/30');
        renderItens('lista-doces', doces, 'border-pink-500/20');

        lucide.createIcons();

        let carrinho =
            JSON.parse(localStorage.getItem('carrinho_esfiha')) || {};

        let total = 0;
        let totalQtd = 0;
        let ultimoFoco = null;

        atualizarTotal();

        const modal = document.getElementById('modal-revisao');
        const listaRevisao = document.getElementById('lista-revisao');
        const modalScroll = document.getElementById('modal-scroll');

        if (listaRevisao) {
            listaRevisao.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-carrinho-action]');
                if (!btn) return;

                const item = decodeURIComponent(btn.getAttribute('data-item') || '');
                const action = btn.getAttribute('data-carrinho-action');

                if (!item) return;

                ajustarQuantidade(item, action === 'inc' ? 1 : -1);
            });
        }

        if (modalScroll) {
            modalScroll.addEventListener('scroll', () => {
                if (!modal || modal.style.display !== 'flex') return;
                atualizarScrollModal();
            }, { passive: true });
        }

        function add(nome, preco) {

            if (!carrinho[nome]) {
                carrinho[nome] = {
                    qtd: 0,
                    preco: preco
                };
            }

            carrinho[nome].qtd++;

            salvarCarrinho();

            atualizarTotal();

            const t = document.getElementById('toast');

            t.style.opacity = '1';

            setTimeout(() => {
                t.style.opacity = '0';
            }, 1000);
        }

        function atualizarTotal() {

            total = 0;
            totalQtd = 0;

            for (let i in carrinho) {
                total += carrinho[i].qtd * carrinho[i].preco;
                totalQtd += carrinho[i].qtd;
            }

            document.getElementById('total-badge').innerText =
                brl.format(total);

            const qtdBadge = document.getElementById('qtd-badge');
            if (qtdBadge) {
                qtdBadge.innerText = String(totalQtd);
                if (totalQtd > 0) qtdBadge.classList.remove('hidden');
                else qtdBadge.classList.add('hidden');
            }

            if (document.getElementById('total-revisao')) {

                document.getElementById('total-revisao').innerText =
                    brl.format(total);
            }

            const qtdRevisao = document.getElementById('qtd-revisao');
            if (qtdRevisao) qtdRevisao.innerText = String(totalQtd);
        }

        function abrirModal() {
            if (!modal) return;

            ultimoFoco = document.activeElement;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';

            atualizarScrollModal();

            const btnEnviar = document.getElementById('btn-enviar');
            if (btnEnviar) btnEnviar.focus();
        }

        function atualizarScrollModal() {
            const scrollEl = document.getElementById('modal-scroll');
            const bar = document.getElementById('modal-scrollbar');
            const thumb = document.getElementById('modal-thumb');
            if (!scrollEl || !bar || !thumb) return;

            const client = scrollEl.clientHeight || 0;
            const scrollH = scrollEl.scrollHeight || 0;

            if (!client || scrollH <= client + 1) {
                bar.style.opacity = '0';
                return;
            }

            // Track com ~70% da altura do container, centralizado.
            const trackH = Math.max(90, Math.floor(client * 0.7));
            const top = Math.max(0, Math.floor((client - trackH) / 2));

            bar.style.top = `${top}px`;
            bar.style.height = `${trackH}px`;
            bar.style.opacity = '1';

            const maxScroll = scrollH - client;
            const ratio = maxScroll > 0 ? (scrollEl.scrollTop / maxScroll) : 0;

            const thumbH = Math.max(24, Math.floor(trackH * (client / scrollH)));
            const thumbTop = Math.floor((trackH - thumbH) * Math.min(1, Math.max(0, ratio)));

            thumb.style.height = `${thumbH}px`;
            thumb.style.top = `${thumbTop}px`;
        }

        function fecharRevisao() {
            if (!modal) return;

            modal.style.display = 'none';
            document.body.style.overflow = '';

            if (ultimoFoco && typeof ultimoFoco.focus === 'function') {
                ultimoFoco.focus();
            }
        }

        function limparSacola() {
            carrinho = {};
            localStorage.setItem('carrinho_esfiha', JSON.stringify(carrinho));
            atualizarTotal();

            const lista = document.getElementById('lista-revisao');
            if (lista) lista.innerHTML = '';

            fecharRevisao();
        }

        function salvarCarrinho() {
            localStorage.setItem('carrinho_esfiha', JSON.stringify(carrinho));
        }

        function renderRevisao() {

            const lista = document.getElementById('lista-revisao');
            if (!lista) return;

            lista.innerHTML = '';

            for (const item in carrinho) {

                const itemKey = encodeURIComponent(item);

                lista.innerHTML += `
                    <div class="flex justify-between gap-3 items-center bg-white/5 p-4 rounded-2xl border border-white/10">

                        <div class="min-w-0">
                            <p class="font-bold leading-tight truncate text-xs md:text-sm">
                                ${item}
                            </p>

                            <p class="text-white/50 text-[0.7rem] md:text-xs">
                                Unitário: ${brl.format(carrinho[item].preco)}
                            </p>
                        </div>

                        <div class="flex items-center justify-end gap-3 flex-shrink-0">
                            <span class="font-black text-[#facc15] whitespace-nowrap text-xs md:text-sm text-right">
                                ${brl.format(carrinho[item].qtd * carrinho[item].preco)}
                            </span>

                            <div class="inline-flex items-center gap-1 bg-black/20 rounded-2xl px-1.5 py-1 border border-white/10">
                                <button type="button"
                                    data-carrinho-action="dec"
                                    data-item="${itemKey}"
                                    aria-label="Diminuir ${item}"
                                    class="w-7 h-7 rounded-lg bg-white/10 hover:bg-white/15 border border-white/10 font-black text-xs leading-none">
                                    -
                                </button>

                                <span class="font-extrabold text-[0.7rem] w-5 text-center select-none">
                                    ${carrinho[item].qtd}
                                </span>

                                <button type="button"
                                    data-carrinho-action="inc"
                                    data-item="${itemKey}"
                                    aria-label="Aumentar ${item}"
                                    class="w-7 h-7 rounded-lg bg-white/10 hover:bg-white/15 border border-white/10 font-black text-xs leading-none">
                                    +
                                </button>
                            </div>
                        </div>
                    </div>`;
            }

            ajustarAlturaListaRevisao();
        }

        function ajustarAlturaListaRevisao() {
            const lista = document.getElementById('lista-revisao');
            if (!lista) return;

            const aplicar = () => {
                const itens = Array.from(lista.children);

                const maxItensVisiveis = 2;

                if (itens.length <= maxItensVisiveis) {
                    lista.style.maxHeight = '';
                    return true;
                }

                // Altura = bottom do N-ésimo item relativo ao topo da lista.
                // Usa DOMRects para considerar margens/gaps corretamente.
                const listaRect = lista.getBoundingClientRect();
                const ultimoItemVisivel = itens[maxItensVisiveis - 1];
                const itemRect = ultimoItemVisivel.getBoundingClientRect();

                const altura = Math.max(0, Math.floor(itemRect.bottom - listaRect.top));

                lista.style.maxHeight = `${altura}px`;
                return altura > 0;
            };

            requestAnimationFrame(() => {
                const ok = aplicar();
                // Reaplica em seguida para garantir after fonts/layout settle.
                if (!ok) setTimeout(aplicar, 50);
                else setTimeout(aplicar, 50);
            });
        }

        function ajustarQuantidade(item, delta) {

            if (!carrinho[item]) return;

            carrinho[item].qtd += delta;

            if (carrinho[item].qtd <= 0) {
                delete carrinho[item];
            }

            salvarCarrinho();
            atualizarTotal();

            if (Object.keys(carrinho).length === 0) {
                const lista = document.getElementById('lista-revisao');
                if (lista) lista.innerHTML = '';
                fecharRevisao();
                return;
            }

            renderRevisao();
        }

        function abrirRevisao() {

            if (Object.keys(carrinho).length === 0) {

                alert("Sua sacola está vazia! Escolha uma delícia primeiro. 😋");

                return;
            }

            renderRevisao();

            const pagamentoSalvo = localStorage.getItem('pagamento_esfiha') || '';

            if (pagamentoSalvo) {
                const pagamentoEl = document.querySelector(`input[name="pagamento"][value="${pagamentoSalvo}"]`);
                if (pagamentoEl) pagamentoEl.checked = true;
            }

            abrirModal();
        }

        function confirmarWhatsApp() {

            let msg = "Olá! Quero saborear o seguinte pedido:\n\n";

            for (const item in carrinho) {
                msg += `*${carrinho[item].qtd}x* ${item} - ${brl.format(carrinho[item].qtd * carrinho[item].preco)}\n`;
            }

            msg += `\n *TOTAL: ${brl.format(total)}*`;

            const pagamentoEl = document.querySelector('input[name="pagamento"]:checked');
            const pagamento = (pagamentoEl?.value || '').trim();

            if (!pagamento) {
                alert('Selecione a forma de pagamento (Pix ou Cartão). 😊');
                return;
            }

            localStorage.setItem('pagamento_esfiha', pagamento);

            msg += `\n\n*PAGAMENTO:* ${pagamento}`;

            window.open(
                `https://wa.me/5564992186249?text=${encodeURIComponent(msg)}`,
                '_blank'
            );
        }

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (!modal || modal.style.display !== 'flex') return;
            fecharRevisao();
        });

        window.addEventListener('resize', () => {
            if (!modal || modal.style.display !== 'flex') return;
            atualizarScrollModal();
        });

        if (modal) {
            modal.addEventListener('click', (e) => {
                if (e.target !== modal) return;
                fecharRevisao();
            });
        }
    </script>

</body>
