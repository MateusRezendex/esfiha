<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esfiha - Sabor que Vicia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #4a0000;
            /* MESMO FUNDO DO CARDÁPIO */
            background-image: linear-gradient(to bottom, rgba(74, 0, 0, 0.75), rgba(74, 0, 0, 0.95)), 
                              url('./fundo.png'); 
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
        }

        /* Ajuste para mobile para manter a foto bonita */
        @media (max-width: 762px) {
            body {
                background-size: cover;
                background-position: center center;
                background-attachment: scroll;
            }
        }

        .gold-border {
            border-color: #d4a017;
        }

        /* Cartão com efeito de vidro para destacar no fundo com imagem */
        .glass-btn {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .btn-hover:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
        }

        
    </style>
</head>

<body class="text-white min-h-screen flex flex-col items-center">

    <main class="w-full max-w-md px-6 py-10 flex flex-col items-center flex-grow relative z-10">

        <div class="mb-12 relative flex flex-col items-center">
            <div class="absolute inset-0 bg-yellow-500 rounded-full blur-3xl opacity-20"></div>
            <img src="./logo.png" alt="Esfiha Logo" class="relative w-62 h-62 object-contain mb-4">
        </div>

        <div class="w-full space-y-5">

            <a href="cardapio.html"
                class="flex items-center p-1 pr-6 border-2 gold-border rounded-full glass-btn btn-hover transition-all duration-300">
                <div class="bg-[#facc15] p-3 rounded-full mr-4 shadow-lg text-black">
                    <i data-lucide="pizza" class="w-6 h-6"></i>
                </div>
                <span class="flex-1 text-center font-bold text-sm tracking-wide uppercase">
                    🍕 Cardápio Digital
                </span>
            </a>

            <a href="https://wa.me/5564992186249?text=Olá! Gostaria de fazer um pedido." 
                target="_blank"
                class="flex items-center p-1 pr-6 border-2 gold-border rounded-full glass-btn btn-hover transition-all duration-300">
                <div class="bg-[#16a34a] p-3 rounded-full mr-4 shadow-lg">
                    <i data-lucide="message-circle" class="w-6 h-6"></i>
                </div>
                <span class="flex-1 text-center font-bold text-sm tracking-wide uppercase">
                    Peça pelo whatsapp
                </span>
            </a>

        </div>

    </main>

    <footer class="mt-8 mb-8 text-xs text-white/50 text-center relative z-10">
        © <span id="current-year"></span> Esfiha — Sabor que vicia
    </footer>

    <script>
        lucide.createIcons();
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>

</html>
