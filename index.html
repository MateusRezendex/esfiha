<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esfiha Delivery</title>

    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="./img/logo.webp" type="image/webp">
    <link rel="stylesheet" href="./dist/tailwind.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">

    <!-- Meta Pixel Code -->
    <script>
        window.fbq = window.fbq || function () {
            window.fbq.callMethod
                ? window.fbq.callMethod.apply(window.fbq, arguments)
                : window.fbq.queue.push(arguments);
        };
        window._fbq = window._fbq || window.fbq;
        window.fbq.push = window.fbq;
        window.fbq.loaded = false;
        window.fbq.version = '2.0';
        window.fbq.queue = window.fbq.queue || [];
        window.fbq('init', '2164884420944203');
        window.fbq('track', 'PageView');

        const loadFacebookPixel = () => {
            if (window.fbq.scriptLoaded) return;
            window.fbq.scriptLoaded = true;
            const script = document.createElement('script');
            script.async = true;
            script.src = 'https://connect.facebook.net/en_US/fbevents.js';
            document.head.appendChild(script);
        };

        window.addEventListener('pointerdown', loadFacebookPixel, { once: true, passive: true });
        window.addEventListener('keydown', loadFacebookPixel, { once: true });
        window.addEventListener('load', () => {
            setTimeout(loadFacebookPixel, 8000);
        }, { once: true });
    </script>
    <!-- End Meta Pixel Code -->

    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="./js/analytics.js" defer></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #4a0000;
            background-image:
                linear-gradient(to bottom,
                    rgba(74, 0, 0, 0.75),
                    rgba(74, 0, 0, 0.95)),
                image-set(url('./img/fundo.webp') type('image/webp'), url('./img/fundo.png') type('image/png'));

            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
            overflow: hidden;
        }

        .gold-border {
            border-color: #d4a017;
        }

        .glass-btn {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .btn-hover:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
        }

        .home-action {
            min-height: 3.5rem;
        }

        .home-action-icon {
            width: 3rem;
            height: 3rem;
            display: grid;
            place-items: center;
            flex: 0 0 3rem;
        }

        .feedback-callout {
            position: relative;
            width: min(14rem, 100%);
            color: #4a0000;
            background: linear-gradient(135deg, #fde047, #d4a017);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            animation: callout-float 2.4s ease-in-out infinite;
        }

        @keyframes callout-float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .feedback-callout:hover,
        .feedback-callout:focus-visible {
            animation-play-state: paused;
            transform: translateY(0);
        }

        .feedback-callout::before {
            content: "";
            position: absolute;
            top: 50%;
            left: -0.7rem;
            width: 1.4rem;
            height: 1.4rem;
            border-radius: 0.2rem;
            background: #efd02d;
            transform: translateY(-50%) rotate(45deg);
        }

        .feedback-callout:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 4px;
        }

        @media (max-width: 767px) {
            body {
                background-attachment: scroll;
            }

            .feedback-callout::before {
                top: -0.55rem;
                left: 50%;
                transform: translateX(-50%) rotate(45deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .feedback-callout {
                animation: none;
            }
        }
    </style>
</head>

<body class="text-white h-screen w-screen overflow-hidden">
    <noscript><img height="1" width="1" style="display:none"
            src="https://www.facebook.com/tr?id=2164884420944203&ev=PageView&noscript=1" /></noscript>

    <main
        class="h-full w-full max-w-2xl mx-auto px-6 py-2 flex flex-col items-center justify-center relative z-10">

        <!-- LOGO -->
        <div class="relative flex-none flex flex-col items-center justify-center gap-5 w-full pt-2 mb-5 sm:mb-8">

            <div class="relative flex flex-col items-center">

                <div class="absolute inset-0 bg-yellow-500 rounded-full blur-3xl opacity-20"></div>

                <picture>
                    <source srcset="./img/logo.webp" type="image/webp">
                    <img src="./img/logo.png"
                        alt="Esfiha Logo"
                        width="500"
                        height="500"
                        decoding="async"
                        fetchpriority="high"
                        class="relative max-h-[34vh] sm:max-h-[45vh] w-auto object-contain transition-all duration-500">
                </picture>

            </div>

            <div
                class="flex justify-center md:absolute md:left-[calc(50%+11rem)] md:top-1/2 md:w-56 md:-translate-y-1/2">
                <a id="link-feedbacks" href="cardapio.html#feedbacks"
                    class="feedback-callout flex-none rounded-2xl px-5 py-4 text-left font-bold leading-snug"
                    aria-label="Ver avaliações dos clientes">
                    <span class="relative z-10 block">
                        Veja o que nossos clientes estão dizendo
                    </span>
                    <span class="relative z-10 mt-2 flex items-center gap-1 text-xs font-bold uppercase tracking-wide">
                        Ver avaliações
                    </span>
                </a>
            </div>

        </div>

        <!-- BOTÕES -->
        <div class="w-full space-y-4 mb-6">

            <!-- CARDÁPIO -->
            <a id="link-cardapio" href="cardapio.html"
                class="home-action flex items-center p-1 pr-6 border-2 gold-border rounded-full glass-btn btn-hover transition-all duration-300">

                <div class="home-action-icon bg-[#facc15] rounded-full mr-4 shadow-lg text-black">

                    <!-- ÍCONE CARDÁPIO -->
                    <i data-lucide="book-open-text" class="w-6 h-6"></i>

                </div>

                <span class="flex-1 text-center font-bold text-sm tracking-wide uppercase">
                     Cardápio Digital
                </span>

            </a>

            <!-- WHATSAPP -->
            <a href="https://wa.me/5564992186249?text=Olá! Gostaria de fazer um pedido."
                target="_blank"
                class="home-action flex items-center p-1 pr-6 border-2 gold-border rounded-full glass-btn btn-hover transition-all duration-300">

                <div class="home-action-icon bg-[#16a34a] rounded-full mr-4 shadow-lg">

                    <i data-lucide="message-circle" class="w-6 h-6"></i>

                </div>

                <span class="flex-1 text-center font-bold text-sm tracking-wide uppercase">
                    Peça pelo WhatsApp
                </span>

            </a>

            <!-- INSTAGRAM -->
            <a href="https://www.instagram.com/esfihasdelivery_/"
                target="_blank"
                rel="noopener noreferrer"
                class="home-action flex items-center p-1 pr-6 border-2 gold-border rounded-full glass-btn btn-hover transition-all duration-300">

                <div class="home-action-icon bg-gradient-to-br from-[#f97316] via-[#e11d48] to-[#7c3aed] rounded-full mr-4 shadow-lg">

                    <i data-lucide="instagram" class="w-6 h-6"></i>

                </div>

                <span class="flex-1 text-center font-bold text-sm tracking-wide uppercase">
                    Siga no Instagram
                </span>

            </a>

        </div>

        <!-- RODAPÉ -->
        <footer class="text-xs text-white/50 text-center pb-2">
            © <span id="current-year"></span> Esfiha Delivery
        </footer>

    </main>

    <script>
        if (window.lucide) lucide.createIcons();
        window.addEventListener('load', () => {
            if (window.lucide) lucide.createIcons();
        }, { once: true });

        const linkCardapio = document.getElementById('link-cardapio');
        const linkFeedbacks = document.getElementById('link-feedbacks');
        const trackHomeClick = (eventName, button) => {
            if (!window.SQVAnalytics) return;
            window.SQVAnalytics.track(eventName, {
                buttonName: button,
                location: 'home'
            });
        };

        if (linkCardapio) {
            linkCardapio.addEventListener('click', () => trackHomeClick('menu_click', 'cardapio'));
        }

        if (linkFeedbacks) {
            linkFeedbacks.addEventListener('click', () => trackHomeClick('reviews_click', 'feedbacks'));
        }

        document.querySelectorAll('a[href*="wa.me"]').forEach((link) => {
            link.addEventListener('click', () => trackHomeClick('whatsapp_click', 'whatsapp'));
        });

        document.querySelectorAll('a[href*="instagram.com"]').forEach((link) => {
            link.addEventListener('click', () => trackHomeClick('instagram_click', 'instagram'));
        });

        const params = new URLSearchParams(window.location.search);
        const origem = params.get('origem') || params.get('utm_source') || params.get('utm_medium');
        const destino = params.get('destino') || params.get('posicionamento') || params.get('utm_content') || params.get('utm_campaign');

        [linkCardapio, linkFeedbacks].forEach((link) => {
            if (!link || (!origem && !destino)) return;

            const cardapioUrl = new URL(link.getAttribute('href'), window.location.href);
            if (origem) cardapioUrl.searchParams.set('origem', origem);
            if (destino) cardapioUrl.searchParams.set('destino', destino);
            link.href = `${cardapioUrl.pathname.split('/').pop()}${cardapioUrl.search}${cardapioUrl.hash}`;
        });

        document.getElementById('current-year').textContent =
            new Date().getFullYear();
    </script>

</body>

</html>
